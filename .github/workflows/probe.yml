name: Диагностика источников

# Ручной запуск. Показывает, что реально отдают сайты афиш: какие страницы
# живы, есть ли в них JSON-LD / состояние SPA, сколько ссылок и времён.
# По этому логу чинятся селекторы в scripts/sources/*.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Свои URL через пробел (пусто — список по умолчанию)'
        type: string
        default: ''
      browser:
        description: 'Через Chromium с прокруткой (для страниц, которые рисуются скриптами)'
        type: boolean
        default: false
      scroll_selector:
        description: 'Что считать при прокрутке (по умолчанию — все ссылки)'
        type: string
        default: 'a'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Поставить Chromium
        if: inputs.browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - run: node scripts/probe.mjs
        env:
          PROBE_URLS: ${{ inputs.urls }}
          PROBE_BROWSER: ${{ inputs.browser && '1' || '' }}
          PROBE_SCROLL: ${{ inputs.scroll_selector }}
