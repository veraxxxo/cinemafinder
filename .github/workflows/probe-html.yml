name: Дамп разметки страницы

# Ручной запуск. Показывает структуру HTML вокруг сеансов и кинотеатров,
# чтобы парсер писался по фактической разметке.

on:
  workflow_dispatch:
    inputs:
      page:
        description: 'URL страницы'
        type: string
        default: 'https://www.kinoafisha.info/russia/msk/schedule/'
      browser:
        description: 'Загрузить настоящим Chromium (обходит антибот-заглушки)'
        type: boolean
        default: false
      wait:
        description: 'CSS-селектор, которого дождаться после загрузки'
        type: string
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Поставить Chromium
        if: inputs.browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - run: node scripts/probe-html.mjs
        env:
          PROBE_PAGE: ${{ inputs.page }}
          PROBE_BROWSER: ${{ inputs.browser && '1' || '' }}
          PROBE_WAIT: ${{ inputs.wait }}
