name: Диагностика источников (кинотеатры)

# Ручной запуск. Сравнивает варианты запроса к OpenStreetMap и сторонние
# источники площадок: что и сколько каждый добавляет к текущему списку.

on:
  workflow_dispatch:
    inputs:
      skip_osm:
        description: 'Пропустить медленные запросы к OpenStreetMap'
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-cinemas.mjs
        env:
          SKIP_OSM: ${{ inputs.skip_osm && '1' || '' }}
