name: Обновление данных

on:
  schedule:
    - cron: '25 3,13 * * *'   # 06:25 и 16:25 по Москве
  workflow_dispatch:
    inputs:
      refresh_cinemas:
        description: 'Перечитать кинотеатры из OpenStreetMap'
        type: boolean
        default: true
      days:
        description: 'Сколько дат собрать'
        type: string
        default: '2'
      movies:
        description: 'Сколько фильмов на источник'
        type: string
        default: '8'
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    # Облачные раннеры GitHub. Раньше здесь была подстановка из переменной
    # RUNNER_LABEL — задумка была переключаться на свой сервер без правок
    # кода. Оказалось опасно: стоит завести переменную, не подняв раннер,
    # и джоба встаёт в очередь навсегда, без единой ошибки в интерфейсе.
    # Переезд на свой сервер — это осознанная правка одной строки здесь.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Кинотеатры (OpenStreetMap)
        id: cinemas
        # Список меняется редко: обновляем по расписанию/по кнопке, но падение
        # Overpass не должно ронять сбор расписания.
        continue-on-error: true
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.refresh_cinemas
        run: node scripts/fetch-cinemas.mjs

      - name: Проверить, что кинотеатры на месте
        run: |
          if [ ! -s data/cinemas.json ]; then
            echo "::error::data/cinemas.json пуст и Overpass не ответил — прерываю"
            exit 1
          fi
          node -e "const d=require('./data/cinemas.json');console.log('кинотеатров:',d.count??d.items.length)"

      - name: Поставить Scrapling
        # Обходит проверки по отпечатку клиента, на которых спотыкается
        # обычный запрос. Не встанет — сбор уйдёт на браузер и прокси.
        continue-on-error: true
        run: |
          pip install --quiet -r requirements.txt
          scrapling install || true

      - name: Поставить Chromium
        # kinoafisha отбивает обычные HTTP-запросы, но пускает настоящий
        # браузер. Если установка не удалась — парсер сам уйдёт на прокси.
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Расписание сеансов
        id: schedule
        continue-on-error: true
        env:
          # Каждая страница через браузер — секунды, а их сотни. Берём немного
          # за прогон и опираемся на кэш: запуски идут дважды в сутки и
          # постепенно накрывают всю афишу, вместо того чтобы падать по лимиту.
          DAYS: ${{ inputs.days || '2' }}
          KA_MOVIE_LIMIT: ${{ inputs.movies || '8' }}
          KM_MOVIE_LIMIT: ${{ inputs.movies || '6' }}
        timeout-minutes: 14
        run: node scripts/fetch-schedule.mjs

      - name: Коммит
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Данные генерируются целиком, поэтому сливать их с чужой версией
          # нельзя: rebase упирается в конфликт содержимого JSON и роняет шаг.
          # Вместо слияния откладываем свежие файлы, переезжаем на актуальный
          # main и кладём их сверху — свежесобранное всегда побеждает.
          cp data/cinemas.json data/schedule.json "$RUNNER_TEMP/"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/cinemas.json" "$RUNNER_TEMP/schedule.json" data/
            git add data/

            if git diff --cached --quiet; then
              echo "Изменений нет."
              exit 0
            fi

            git commit -m "data: обновление $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "Запушено с попытки $attempt."
              exit 0
            fi
            echo "Пуш отклонён — в main успели влить ещё что-то, пробую снова…"
            sleep $((attempt * 5))
          done

          echo "::error::Не удалось запушить данные за 3 попытки"
          exit 1

      - name: Итог
        run: |
          echo "### Обновление данных" >> $GITHUB_STEP_SUMMARY
          node -e "
            const c=require('./data/cinemas.json');
            let s=null; try{s=require('./data/schedule.json')}catch{}
            const L=[];
            L.push('- Кинотеатров: **'+(c.count??c.items.length)+'**');
            if(s){
              L.push('- Сеансов: **'+s.stats.shows+'**, фильмов: **'+s.stats.movies+'**, площадок с сеансами: **'+s.stats.cinemas+'**');
              L.push('- Даты: '+(s.dates.join(', ')||'—'));
              L.push('- Уровни парсинга: '+JSON.stringify(s.layers));
              L.push('- Названий без совпадения с OSM: '+s.stats.unmatchedNames);
            } else L.push('- Расписание собрать не удалось');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join('\n')+'\n');
          "

      - name: Пометить сбой сбора расписания
        if: steps.schedule.outcome == 'failure'
        run: |
          echo "::warning::Расписание не собралось — данные оставлены прежними. Смотри лог шага «Расписание сеансов»."
